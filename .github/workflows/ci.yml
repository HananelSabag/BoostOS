name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build BoostOS.slnx -c Release

      - name: Test
        run: dotnet test BoostOS.slnx -c Release --no-build --logger "console;verbosity=normal"

      - name: Publish
        run: dotnet publish src/BoostOS/BoostOS.csproj -c Release -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: BoostOS
          path: publish
